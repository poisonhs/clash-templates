; =====================================================================
; ACL4SSR 格式 · 订阅转换模板
; 规则数据源：MetaCubeX/meta-rules-dat（meta 分支）
; 适用：OpenClash「自定义模板」/ subconverter 的 config= 参数
;
; 与 ACL4SSR 官方模板的区别只在规则源：
;   官方模板 → ACL4SSR/Clash/*.list（DOMAIN-SUFFIX 的 classical 文本）
;   本模板   → meta-rules-dat 的 *.yaml（payload 列表），用 clash-domain / clash-ipcidr 指定
; 之所以不能直接换成 meta-rules-dat 的 .list：那个 .list 是裸 `+.domain` 与裸 CIDR，
; subconverter 按 surge/classical 解析会认不出来；.yaml 才是它能直接吃的格式。
;
; 语法保持 ACL4SSR 原样：ruleset=分组,规则   custom_proxy_group=名`类型`成员...
; =====================================================================

[custom]

; ------------------------- 规则（顺序即优先级）-------------------------

; 局域网 / 内网地址
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.yaml,86400
ruleset=🎯 全球直连,clash-ipcidr:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.yaml,86400

; 广告与追踪器拦截
ruleset=🛑 广告拦截,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.yaml,86400
