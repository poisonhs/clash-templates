; =====================================================================
; ACL4SSR_Mini 格式 · 精简订阅转换模板
; 规则数据源：MetaCubeX/meta-rules-dat（meta 分支）
; 适用：OpenClash「自定义模板」/ subconverter 的 config= 参数
;
; 规模对齐 ACL4SSR_Mini：11 条规则、5 个分组
; 与 Mini 原版的差别只在规则源和写法：
;   Mini  → rules/ACL4SSR/Clash/*.list（相对路径，依赖转换器本地 rules 目录）
;   本模板 → meta-rules-dat 的 *.yaml（完整 URL，clash-domain / clash-ipcidr）
;
; 精简取舍：Mini 里 ProxyMedia 与 ProxyLite 分两组规则，这里合并成 geolocation-!cn，
; 少 4 行、少两个分组，分流结果对日常使用没有区别。
; =====================================================================

[custom]

; ------------------------- 规则 -------------------------

; 局域网与内网
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.yaml,86400
ruleset=🎯 全球直连,clash-ipcidr:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.yaml,86400

; 广告与跟踪器
ruleset=🛑 全球拦截,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ads-all.yaml,86400
ruleset=🛑 全球拦截,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/tracker.yaml,86400

; 国内细分（必须先于 cn 大集合）
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/google-cn.yaml,86400
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam@cn.yaml,86400

; 境外（Telegram 单列，便于单独切换出口）
ruleset=🚀 节点选择,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/telegram.yaml,86400
ruleset=🚀 节点选择,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/geolocation-!cn.yaml,86400

; 国内兜底
ruleset=🎯 全球直连,clash-domain:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/cn.yaml,86400
ruleset=🎯 全球直连,clash-ipcidr:https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/cn.yaml,86400

; 未命中
ruleset=🐟 漏网之鱼,[]FINAL

; ------------------------- 分组 -------------------------

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`300,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`.*

; ------------------------- 开关 -------------------------
; 必须为 true，否则 ruleset= 不会生成任何规则
enable_rule_generator=true
overwrite_original_rules=true
